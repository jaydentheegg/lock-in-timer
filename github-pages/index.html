<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#06080a" />
    <title>专注计时器</title>
    <link rel="icon" href="./favicon.svg" />
    <link rel="stylesheet" href="./styles.css?v=11" />
  </head>
  <body>
    <main id="focusPage" class="focus-page" aria-label="专注计时器" data-phase="link" data-anomaly="none" data-started="false">
      <video id="video" class="focus-video" src="./study-background.mp4" poster="./study-poster.jpg" loop muted playsinline preload="metadata">
        <track kind="captions" src="./empty-captions.vtt" srclang="zh" label="无对白" default />
      </video>
      <audio id="audio" src="./study-audio.m4a" loop preload="none">
        <track kind="captions" src="./empty-captions.vtt" srclang="zh" label="无对白" default />
      </audio>
      <div class="focus-shade" aria-hidden="true"></div>

      <div class="phase-rail" aria-hidden="true"><i id="phaseRail"></i></div>
      <div class="phase-indicator" aria-hidden="true"><span id="phaseName">LINK</span></div>
      <div id="previewIndicator" class="preview-indicator" hidden>PREVIEW // ACCELERATED</div>

      <time id="clock" class="focus-clock" datetime="PT0S" data-clock="00:00">00:00</time>

      <div class="playback-controls">
        <button id="play" class="hud-button" aria-label="开始计时" aria-pressed="false">
          <svg class="control-icon icon-play" viewBox="0 0 32 32" aria-hidden="true"><path d="M8 4 27 16 8 28V4Zm5 8v8l7-4-7-4Z" fill-rule="evenodd" /></svg>
          <svg class="control-icon icon-pause" viewBox="0 0 32 32" aria-hidden="true"><path d="M7 5h7v22H7zM18 5h7v22h-7z" /></svg>
        </button>
        <button id="sound" class="hud-button is-active" aria-label="关闭声音" aria-pressed="true">
          <svg class="control-icon icon-sound-on" viewBox="0 0 32 32" aria-hidden="true"><path d="M4 12h6l7-6v20l-7-6H4v-8Z" /><path d="M21 11c2.6 2.7 2.6 7.3 0 10M24.5 7.5c4.7 4.7 4.7 12.3 0 17" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" /></svg>
          <svg class="control-icon icon-sound-off" viewBox="0 0 32 32" aria-hidden="true"><path d="M4 12h6l7-6v20l-7-6H4v-8Z" /><path d="m21 12 7 8m0-8-7 8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" /></svg>
        </button>
        <button id="reset" class="hud-button" aria-label="重置计时" disabled>
          <svg class="control-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 6a10 10 0 1 0 9.4 6.6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" /><path d="M26 3v7h-7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" /></svg>
        </button>
      </div>

      <button id="fullscreen" class="fullscreen-button">全屏</button>
      <div class="key-hint" aria-hidden="true">SPACE / R / F / M</div>

      <div id="reminder" class="screen-reminder" role="status" aria-live="polite"></div>
      <section id="milestone" class="milestone-event" role="status" aria-live="polite">
        <div id="milestoneCode" class="milestone-code"></div>
        <p id="milestoneMessage"></p>
      </section>
      <div id="anomalyLabel" class="anomaly-label" aria-hidden="true"></div>
      <div class="portrait-hint">横过来。</div>
    </main>
    <script src="./app.js?v=11"></script>
  </body>
</html>
