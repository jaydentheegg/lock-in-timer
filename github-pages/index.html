<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#050606" />
    <title>专注计时器</title>
    <link rel="icon" href="./favicon.svg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="focus-page" aria-label="专注计时器">
      <video id="video" class="focus-video" src="./study-background.mp4" loop muted playsinline preload="auto">
        <track kind="captions" src="./empty-captions.vtt" srclang="zh" label="无对白" default />
      </video>
      <audio id="audio" src="./study-audio.m4a" loop preload="auto">
        <track kind="captions" src="./empty-captions.vtt" srclang="zh" label="无对白" default />
      </audio>
      <div class="focus-shade" aria-hidden="true"></div>

      <button id="fullscreen" class="fullscreen-button">全屏</button>
      <time id="clock" class="focus-clock" datetime="PT0S">00:00</time>

      <div class="playback-controls">
        <button id="play" class="play-button" aria-label="播放">▶</button>
        <button id="sound" class="sound-button">声音：开</button>
      </div>

      <div id="reminder" class="screen-reminder" role="status" aria-live="polite"></div>
      <div class="portrait-hint">横过来。</div>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
